name: revisar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis de cada script
        run: for f in *.js .github/*.mjs; do node --check "$f"; done

      - name: El manifest apunta a archivos que existen
        run: node .github/revisar-manifest.mjs

      # Solo lo que necesita el navegador: sin README, capturas ni la carpeta .github.
      - name: Armar el .zip
        run: |
          version=$(node -p "require('./manifest.json').version")
          mkdir -p dist
          zip -r "dist/Respondon-v$version.zip" manifest.json *.js *.html iconos LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: revisar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist

      - name: Crear la release con el .zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Respondón $GITHUB_REF_NAME" --notes-file .github/notas-release.md
